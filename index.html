<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>PixForge · Studio de développement web</title>
    <meta name="description" content="PixForge est un studio de développement web et de solutions numériques : sites web, applications métier et API sur mesure." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PixForge · Studio de développement web" />
    <meta property="og:description" content="Sites web, applications métier et solutions numériques sur mesure." />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <script>
      /* Applique le thème avant le premier rendu pour éviter le flash. */
      (function () {
        try {
          var stored = localStorage.getItem('ksinfo-theme');
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;

          /*
           * Arme les apparitions au défilement avant le premier rendu : sans
           * cette classe, le CSS laisse tout visible (voir src/hooks/useReveal.js).
           */
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('reveal-ready');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
